services:
  app:
    environment:
      RATE_LIMIT_RPS: "1000"
      RATE_LIMIT_BURST: "1000"

  db:
    volumes: !reset []

  integration-test:
    container_name: integration-test
    platform: linux/amd64
    pid: "host"
    build:
      context: .
      dockerfile: integration-test/Dockerfile
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - test.lvh.me


networks:
  app_network:
    external: false
